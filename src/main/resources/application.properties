spring.application.name=backend-proxy

# Railway / Render inject the PORT variable
server.port=${PORT:8080}

# Comma-separated list of allowed origins (e.g. https://my-front.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Time zone used for the daily history and the scheduled resets
app.timezone=${APP_TIMEZONE:America/Bogota}

# Simulated latency of the mock AI service
app.ai.mock-delay-ms=${MOCK_DELAY_MS:1200}
